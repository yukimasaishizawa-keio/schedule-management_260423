<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Campus Life Planner Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS（デザイン設定） --- */
        :root {
            --bg-color: #F2F2F7; --card-bg: #FFFFFF; --primary-color: #007AFF;
            --text-main: #000000; --text-sub: #8E8E93; --danger: #FF3B30;
            --warning: #FF9500; --success: #34C759; --border-color: #E5E5EA;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }
        body.dark-mode {
            --bg-color: #000000; --card-bg: #1C1C1E; --text-main: #FFFFFF;
            --text-sub: #AEAEB2; --border-color: #38383A; --glass-bg: rgba(28, 28, 30, 0.85);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: calc(80px + env(safe-area-inset-bottom)); transition: background-color 0.3s; }
        
        header { background-color: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: fixed; top: 0; width: 100%; padding-top: env(safe-area-inset-top); height: calc(60px + env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; padding-left: 20px; padding-right: 20px; font-size: 18px; font-weight: 600; border-bottom: 0.5px solid var(--border-color); z-index: 1000; }
        .theme-toggle { background: none; border: none; color: var(--primary-color); font-size: 20px; cursor: pointer; }
        
        main { padding: calc(80px + env(safe-area-inset-top)) 16px 20px; max-width: 600px; margin: 0 auto; }
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 16px; }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text-sub); margin-bottom: 12px; }
        
        .list-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border-color); }
        .list-item:last-child { border-bottom: none; }
        .list-content { flex-grow: 1; margin-left: 12px; }
        .list-title { font-size: 16px; font-weight: 500; }
        .list-desc { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        .delete-btn { color: var(--danger); background: none; border: none; font-size: 16px; padding: 8px; cursor: pointer; }
        
        .progress-container { width: 100%; background-color: var(--border-color); border-radius: 8px; height: 8px; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--success); width: 0%; transition: width 0.3s ease; }
        
        input[type="checkbox"] { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--text-sub); appearance: none; outline: none; cursor: pointer; position: relative; }
        input[type="checkbox"]:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
        input[type="checkbox"]:checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: white; position: absolute; font-size: 12px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        .timetable { display: grid; grid-template-columns: 30px repeat(5, 1fr); gap: 4px; text-align: center; font-size: 12px; }
        .tt-header { font-weight: 600; padding: 4px 0; color: var(--text-sub); }
        .tt-time { font-weight: 600; color: var(--text-sub); display: flex; align-items: center; justify-content: center; }
        .tt-cell { background-color: var(--border-color); border-radius: 6px; padding: 4px; min-height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 500; cursor: pointer; word-break: break-all; }
        .tt-cell.active-class { background-color: rgba(0, 122, 255, 0.15); color: var(--primary-color); }

        .timeline { position: relative; padding-left: 20px; }
        .timeline::before { content: ''; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background-color: var(--border-color); }
        .tl-item { position: relative; margin-bottom: 20px; }
        .tl-dot { position: absolute; left: -20px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background-color: var(--primary-color); border: 2px solid var(--bg-color); }

        .tab-bar { position: fixed; bottom: 0; width: 100%; height: calc(65px + env(safe-area-inset-bottom)); background-color: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 900; }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); font-size: 10px; font-weight: 500; cursor: pointer; width: 25%; }
        .tab-item i { font-size: 22px; margin-bottom: 4px; }
        .tab-item.active { color: var(--primary-color); }

        .fab { position: fixed; bottom: calc(85px + env(safe-area-inset-bottom)); right: 20px; width: 56px; height: 56px; border-radius: 50%; background-color: var(--primary-color); color: white; border: none; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4); font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 950; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1001; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background-color: var(--card-bg); border-radius: 20px 20px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); z-index: 1002; transition: bottom 0.3s; }
        .modal-overlay.active .modal-sheet { bottom: 0; }
        .modal-handle { width: 40px; height: 5px; background-color: var(--border-color); border-radius: 3px; margin: 0 auto 20px; }
        
        /* フォームスタイル */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; background-color: var(--bg-color); color: var(--text-main); }
        .btn-submit { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }

        @media (min-width: 768px) {
            body { padding-bottom: 0; }
            header { left: 250px; width: calc(100% - 250px); padding-top: 0; height: 60px; }
            .tab-bar { flex-direction: column; justify-content: flex-start; width: 250px; height: 100vh; top: 0; left: 0; border-top: none; border-right: 1px solid var(--border-color); padding-top: 60px; }
            .tab-item { width: 100%; flex-direction: row; padding: 16px 24px; font-size: 16px; justify-content: flex-start; }
            .tab-item i { margin-bottom: 0; margin-right: 16px; width: 24px; text-align: center; }
            main { margin-left: 250px; padding: 80px 32px 32px; max-width: 800px; }
            .modal-sheet { bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; border-radius: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div id="header-title">ホーム</div>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main>
        <section id="view-home" class="view-section active">
            <h1 class="section-title" id="today-date"></h1>
            <div class="card">
                <div class="card-title">タスク完了率</div>
                <div class="list-desc" id="progress-text">0件中 0件完了</div>
                <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
            </div>
            <div class="card">
                <div class="card-title">未完了のタスク・予定</div>
                <div id="home-tasks-container">
                    </div>
            </div>
        </section>

        <section id="view-timeline" class="view-section">
            <h1 class="section-title">予定表</h1>
            <div class="card">
                <div class="timeline" id="timeline-container">
                    </div>
            </div>
        </section>

        <section id="view-timetable" class="view-section">
            <h1 class="section-title">時間割</h1>
            <p class="list-desc" style="margin-bottom: 10px;">枠をタップして授業を登録・削除できます。</p>
            <div class="card">
                <div class="timetable" id="timetable-container">
                    <div class="tt-header"></div><div class="tt-header">月</div><div class="tt-header">火</div><div class="tt-header">水</div><div class="tt-header">木</div><div class="tt-header">金</div>
                    </div>
            </div>
        </section>

        <section id="view-tasks" class="view-section">
            <h1 class="section-title">課題・タスク管理</h1>
            <div class="card">
                <div class="card-title">未完了</div>
                <div id="incomplete-tasks"></div>
            </div>
            <div class="card">
                <div class="card-title">完了済み</div>
                <div id="completed-tasks" style="opacity: 0.6;"></div>
            </div>
        </section>
    </main>

    <button class="fab" onclick="openModal('task')"><i class="fa-solid fa-plus"></i></button>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-handle"></div>
            <h2 class="section-title" id="modal-title" style="font-size: 18px;">予定・課題を追加</h2>
            
            <div class="form-group">
                <label>種類</label>
                <select class="form-control" id="input-type">
                    <option value="task">課題・タスク</option>
                    <option value="event">予定（タイムライン）</option>
                </select>
            </div>
            <div class="form-group">
                <label>タイトル</label>
                <input type="text" class="form-control" id="input-title" placeholder="例：プログラミング課題" required>
            </div>
            <div class="form-group">
                <label>期限・時間</label>
                <input type="text" class="form-control" id="input-time" placeholder="例：明日まで / 13:00 - 15:00">
            </div>
            <button class="btn-submit" onclick="saveItem()">追加する</button>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', 'ホーム', this)"><i class="fa-solid fa-house"></i><span>ホーム</span></div>
        <div class="tab-item" onclick="switchTab('timeline', '予定表', this)"><i class="fa-solid fa-clock"></i><span>予定</span></div>
        <div class="tab-item" onclick="switchTab('timetable', '時間割', this)"><i class="fa-solid fa-table-cells-large"></i><span>時間割</span></div>
        <div class="tab-item" onclick="switchTab('tasks', '課題管理', this)"><i class="fa-solid fa-check-double"></i><span>課題</span></div>
    </nav>

    <script>
        // --- データの初期化と読み込み ---
        let appData = JSON.parse(localStorage.getItem('campusPlannerData')) || {
            tasks: [
                { id: 1, title: 'システムテストを行う', time: '今日中', completed: false, type: 'task' }
            ],
            events: [
                { id: 2, title: 'ゼミミーティング', time: '14:00 - 15:30', type: 'event' }
            ],
            timetable: {} // { "0-0": "微積", "1-0": "英語" } のような形式(行-列)
        };

        // データを保存する関数
        function saveData() {
            localStorage.setItem('campusPlannerData', JSON.stringify(appData));
            renderAll(); // 保存後に画面を更新
        }

        // --- 画面の描画処理 ---
        function renderAll() {
            renderTasks();
            renderEvents();
            renderTimetable();
            renderHome();
        }

        function renderTasks() {
            const incompleteContainer = document.getElementById('incomplete-tasks');
            const completedContainer = document.getElementById('completed-tasks');
            incompleteContainer.innerHTML = '';
            completedContainer.innerHTML = '';

            let total = appData.tasks.length;
            let completedCount = 0;

            appData.tasks.forEach(task => {
                if(task.completed) completedCount++;
                
                const html = `
                    <div class="list-item">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                        <div class="list-content">
                            <div class="list-title" style="${task.completed ? 'text-decoration: line-through;' : ''}">${task.title}</div>
                            <div class="list-desc">${task.time}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${task.id}, 'task')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;

                if (task.completed) {
                    completedContainer.innerHTML += html;
                } else {
                    incompleteContainer.innerHTML += html;
                }
            });

            // 進捗バーの更新
            const progressPercent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').innerText = `全 ${total} 件中 ${completedCount} 件完了 (${progressPercent}%)`;
        }

        function renderEvents() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            if (appData.events.length === 0) {
                container.innerHTML = '<p class="list-desc">予定はありません</p>';
                return;
            }

            // 予定を時間の昇順でソート（簡易的）
            const sortedEvents = [...appData.events].sort((a, b) => a.time.localeCompare(b.time));

            sortedEvents.forEach(event => {
                container.innerHTML += `
                    <div class="tl-item">
                        <div class="tl-dot"></div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div class="list-desc" style="font-weight:600; color:var(--text-sub); margin-bottom:4px;">${event.time}</div>
                                <div class="list-title">${event.title}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteItem(${event.id}, 'event')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function renderTimetable() {
            const container = document.getElementById('timetable-container');
            // ヘッダーは固定されているので、中身だけ再構築
            let html = `<div class="tt-header"></div><div class="tt-header">月</div><div class="tt-header">火</div><div class="tt-header">水</div><div class="tt-header">木</div><div class="tt-header">金</div>`;
            
            for (let row = 1; row <= 5; row++) { // 1限〜5限
                html += `<div class="tt-time">${row}</div>`;
                for (let col = 1; col <= 5; col++) { // 月〜金
                    const cellKey = `${row}-${col}`;
                    const className = appData.timetable[cellKey] || '';
                    const activeClass = className ? 'active-class' : '';
                    
                    html += `<div class="tt-cell ${activeClass}" onclick="editTimetable('${cellKey}')">${className}</div>`;
                }
            }
            container.innerHTML = html;
        }

        function renderHome() {
            const container = document.getElementById('home-tasks-container');
            container.innerHTML = '';
            
            // 未完了タスクと予定をホームに表示
            const incompleteTasks = appData.tasks.filter(t => !t.completed);
            
            if (incompleteTasks.length === 0 && appData.events.length === 0) {
                container.innerHTML = '<p class="list-desc">今日のタスク・予定はすべて完了しています！</p>';
                return;
            }

            incompleteTasks.forEach(task => {
                container.innerHTML += `
                    <div class="list-item">
                        <i class="fa-solid fa-circle-exclamation" style="color: var(--warning); font-size: 20px;"></i>
                        <div class="list-content">
                            <div class="list-title">${task.title}</div>
                            <div class="list-desc">${task.time}</div>
                        </div>
                    </div>
                `;
            });

            appData.events.forEach(event => {
                container.innerHTML += `
                    <div class="list-item">
                        <i class="fa-regular fa-clock" style="color: var(--primary-color); font-size: 20px;"></i>
                        <div class="list-content">
                            <div class="list-title">${event.title}</div>
                            <div class="list-desc">${event.time}</div>
                        </div>
                    </div>
                `;
            });
        }

        // --- データ操作ロジック ---
        
        // 課題の完了状態を切り替え
        function toggleTask(id) {
            const task = appData.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData();
            }
        }

        // 削除機能
        function deleteItem(id, type) {
            if (confirm('本当に削除しますか？')) {
                if (type === 'task') {
                    appData.tasks = appData.tasks.filter(t => t.id !== id);
                } else if (type === 'event') {
                    appData.events = appData.events.filter(e => e.id !== id);
                }
                saveData();
            }
        }

        // 時間割の編集（プロンプトで簡易入力）
        function editTimetable(cellKey) {
            const currentVal = appData.timetable[cellKey] || '';
            const newVal = prompt('授業名を入力してください（空欄にすると削除されます）', currentVal);
            
            if (newVal !== null) { // キャンセルされなかった場合
                if (newVal.trim() === '') {
                    delete appData.timetable[cellKey];
                } else {
                    appData.timetable[cellKey] = newVal.substring(0, 10); // 長すぎる場合はカット
                }
                saveData();
            }
        }

        // 追加モーダルの保存処理
        function saveItem() {
            const type = document.getElementById('input-type').value;
            const title = document.getElementById('input-title').value.trim();
            const time = document.getElementById('input-time').value.trim();

            if (!title) {
                alert('タイトルを入力してください。');
                return;
            }

            const newItem = {
                id: Date.now(), // 一意のIDとして現在時刻を使用
                title: title,
                time: time,
                type: type
            };

            if (type === 'task') {
                newItem.completed = false;
                appData.tasks.push(newItem);
            } else {
                appData.events.push(newItem);
            }

            saveData();
            closeModalDirect();
            
            // 入力欄をクリア
            document.getElementById('input-title').value = '';
            document.getElementById('input-time').value = '';
        }

        // --- UI（見た目）の操作 ---
        
        // 日付表示
        const today = new Date();
        document.getElementById('today-date').innerText = today.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });

        // タブ切り替え
        function switchTab(tabId, title, element) {
            document.getElementById('header-title').innerText = title;
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ダークモード切替
        let isDarkMode = false;
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            const icon = document.querySelector('.theme-toggle i');
            icon.className = isDarkMode ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        // モーダル開閉
        const modal = document.getElementById('modalOverlay');
        function openModal() { modal.classList.add('active'); }
        function closeModal(e) { if (e.target === modal) modal.classList.remove('active'); }
        function closeModalDirect() { modal.classList.remove('active'); }

        // 初期描画の実行
        renderAll();

    </script>
</body>
</html>
