<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Campus Life Planner Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS変数（ライト/ダークモード対応） */
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --primary-color: #007AFF;
            --text-main: #000000;
            --text-sub: #8E8E93;
            --danger: #FF3B30;
            --warning: #FF9500;
            --success: #34C759;
            --border-color: #E5E5EA;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        /* ダークモード時の色設定 */
        body.dark-mode {
            --bg-color: #000000;
            --card-bg: #1C1C1E;
            --text-main: #FFFFFF;
            --text-sub: #AEAEB2;
            --border-color: #38383A;
            --glass-bg: rgba(28, 28, 30, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            /* iPhoneのホームインジケータ領域を確保 */
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        /* ヘッダー */
        header {
            background-color: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            width: 100%;
            /* iPhoneのノッチ領域を確保 */
            padding-top: env(safe-area-inset-top);
            height: calc(60px + env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 20px;
            padding-right: 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 0.5px solid var(--border-color);
            z-index: 1000;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 20px;
            cursor: pointer;
        }

        /* コンテンツエリア */
        main {
            padding: calc(80px + env(safe-area-inset-top)) 16px 20px;
            max-width: 100%;
            margin: 0 auto;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* カードデザイン */
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); }
        .card-title { font-size: 14px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; margin-bottom: 12px; }

        /* リストアイテム */
        .list-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border-color); }
        .list-item:last-child { border-bottom: none; }
        .list-content { flex-grow: 1; margin-left: 12px; }
        .list-title { font-size: 16px; font-weight: 500; }
        .list-desc { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; color: white; }
        .badge.red { background-color: var(--danger); }
        .badge.orange { background-color: var(--warning); }
        .badge.blue { background-color: var(--primary-color); }

        /* 進捗バー (便利機能) */
        .progress-container { width: 100%; background-color: var(--border-color); border-radius: 8px; height: 8px; margin-top: 8px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--success); width: 65%; border-radius: 8px; }

        /* ボトムナビゲーション (モバイル用) */
        .tab-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: calc(65px + env(safe-area-inset-bottom));
            background-color: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 900;
        }
        .tab-item {
            display: flex; flex-direction: column; align-items: center; color: var(--text-sub); font-size: 10px; font-weight: 500; cursor: pointer; width: 25%;
        }
        .tab-item i { font-size: 22px; margin-bottom: 4px; }
        .tab-item.active { color: var(--primary-color); }

        /* フローティングアクションボタン (FAB) */
        .fab {
            position: fixed;
            bottom: calc(85px + env(safe-area-inset-bottom));
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 950;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.9); }

        /* プリセット登録モーダル (iOSのボトムシート風) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4); z-index: 1001;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background-color: var(--card-bg); border-radius: 20px 20px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            z-index: 1002; transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-sheet { bottom: 0; }
        
        .modal-handle { width: 40px; height: 5px; background-color: var(--border-color); border-radius: 3px; margin: 0 auto 20px; }
        
        .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
        .preset-btn {
            display: flex; flex-direction: column; align-items: center; background: none; border: none; cursor: pointer; color: var(--text-main);
        }
        .preset-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; margin-bottom: 8px; }
        .bg-blue { background-color: var(--primary-color); }
        .bg-orange { background-color: var(--warning); }
        .bg-green { background-color: var(--success); }
        .bg-gray { background-color: var(--text-sub); }


        /* =========================================
           PC・タブレット向けのレスポンシブデザイン 
           ========================================= */
        @media (min-width: 768px) {
            body { padding-bottom: 0; }
            header { left: 250px; width: calc(100% - 250px); padding-top: 0; height: 60px; }
            
            /* サイドバーに変更 */
            .tab-bar {
                flex-direction: column; justify-content: flex-start;
                width: 250px; height: 100vh; top: 0; left: 0; border-top: none; border-right: 1px solid var(--border-color); padding-top: 60px;
            }
            .tab-item { width: 100%; flex-direction: row; padding: 16px 24px; font-size: 16px; justify-content: flex-start; }
            .tab-item i { margin-bottom: 0; margin-right: 16px; font-size: 20px; width: 24px; text-align: center; }
            
            main { margin-left: 250px; padding: 80px 32px 32px; max-width: 1200px; }
            
            /* PCでは2カラムのグリッドレイアウト */
            .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .card { height: fit-content; }
            
            .fab { bottom: 30px; right: 30px; width: 64px; height: 64px; font-size: 28px; }
            
            /* PCのモーダルは中央ポップアップに */
            .modal-sheet {
                bottom: auto; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
                width: 400px; border-radius: 16px; padding: 32px;
                opacity: 0; visibility: hidden;
            }
            .modal-overlay.active .modal-sheet { transform: translate(-50%, -50%) scale(1); opacity: 1; visibility: visible; }
            .modal-handle { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div id="header-title">ホーム</div>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main>
        <section id="view-home" class="view-section active">
            <h1 class="section-title" id="today-date"></h1>
            
            <div class="card">
                <div class="card-title">今週のタスク完了率 (65%)</div>
                <div class="list-desc">13件中 8件完了。いいペースです！</div>
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
            </div>

            <div class="grid-container">
                <div class="card">
                    <div class="card-title">今日締め切り・予定</div>
                    <div class="list-item">
                        <i class="fa-solid fa-circle-exclamation" style="color: var(--danger); font-size: 20px;"></i>
                        <div class="list-content">
                            <div class="list-title">情報工学レポート提出</div>
                            <div class="list-desc">本日 23:59 まで</div>
                        </div>
                        <div class="badge red">今日</div>
                    </div>
                    <div class="list-item">
                        <i class="fa-solid fa-briefcase" style="color: var(--warning); font-size: 20px;"></i>
                        <div class="list-content">
                            <div class="list-title">カフェ アルバイト</div>
                            <div class="list-desc">本日 18:00 - 22:00</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">期限が近い課題</div>
                    <div class="list-item">
                        <div class="list-content" style="margin-left: 0;">
                            <div class="list-title">プログラミング演習 最終課題</div>
                            <div class="list-desc">残り2日 (金曜日)</div>
                        </div>
                        <div class="badge orange">要確認</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-timeline" class="view-section">
            <h1 class="section-title">予定表</h1>
            <div class="card"><p class="list-desc">（タイムライン表示エリア）</p></div>
        </section>

        <section id="view-timetable" class="view-section">
            <h1 class="section-title">時間割</h1>
            <div class="card"><p class="list-desc">（時間割グリッド表示エリア）</p></div>
        </section>

        <section id="view-tasks" class="view-section">
            <h1 class="section-title">課題管理</h1>
            <div class="card"><p class="list-desc">（課題リスト表示エリア）</p></div>
        </section>
    </main>

    <button class="fab" onclick="toggleModal()">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h2 class="section-title" style="font-size: 18px; text-align: center;">予定をクイック追加</h2>
            <div class="preset-grid">
                <button class="preset-btn" onclick="alert('授業登録画面を開きます')">
                    <div class="preset-icon bg-blue"><i class="fa-solid fa-graduation-cap"></i></div>
                    <span style="font-size: 12px; font-weight:500;">授業</span>
                </button>
                <button class="preset-btn" onclick="alert('バイトのシフト登録画面を開きます')">
                    <div class="preset-icon bg-orange"><i class="fa-solid fa-briefcase"></i></div>
                    <span style="font-size: 12px; font-weight:500;">バイト</span>
                </button>
                <button class="preset-btn" onclick="alert('課題登録画面を開きます')">
                    <div class="preset-icon bg-green"><i class="fa-solid fa-book-open"></i></div>
                    <span style="font-size: 12px; font-weight:500;">課題</span>
                </button>
                <button class="preset-btn" onclick="alert('詳細な予定登録画面を開きます')">
                    <div class="preset-icon bg-gray"><i class="fa-solid fa-pen"></i></div>
                    <span style="font-size: 12px; font-weight:500;">その他</span>
                </button>
            </div>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', 'ホーム', this)">
            <i class="fa-solid fa-house"></i><span>ホーム</span>
        </div>
        <div class="tab-item" onclick="switchTab('timeline', '予定', this)">
            <i class="fa-solid fa-clock"></i><span>予定</span>
        </div>
        <div class="tab-item" onclick="switchTab('timetable', '時間割', this)">
            <i class="fa-solid fa-table-cells-large"></i><span>時間割</span>
        </div>
        <div class="tab-item" onclick="switchTab('tasks', '課題管理', this)">
            <i class="fa-solid fa-check-double"></i><span>課題</span>
        </div>
    </nav>

    <script>
        // 日付の表示
        const today = new Date();
        const options = { month: 'long', day: 'numeric', weekday: 'short' };
        document.getElementById('today-date').innerText = today.toLocaleDateString('ja-JP', options);

        // タブ切り替え
        function switchTab(tabId, title, element) {
            document.getElementById('header-title').innerText = title;
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ダークモード切り替え (便利機能)
        let isDarkMode = false;
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            const icon = document.querySelector('.theme-toggle i');
            if(isDarkMode) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        // プリセットモーダルの開閉
        const modal = document.getElementById('modalOverlay');
        function toggleModal() {
            modal.classList.add('active');
        }
        function closeModal(e) {
            // 背景部分をクリックした時だけ閉じる
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
